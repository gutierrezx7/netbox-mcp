[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-mcp"
version = "0.1.0"
description = "Netbox MCP Server"
authors = [
  { name="Sisyphus-Junior", email="sisyphus-junior@example.com" },
]
license = { text="Apache-2.0" }
readme = "README.md"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.20",
]

[project.scripts]
netbox-mcp = "netbox_mcp_server.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["netbox_mcp_server*"]
